name: Android Build (manual)

# The Play/Store-ready release APK is built and signed locally with the project
# keystore and attached to the GitHub Release manually. This workflow only
# produces a debug build on demand so CI can verify the project still compiles.
# It never edits an existing release, so release notes are preserved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
